<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mirra 자동 발행</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <h1>Mirra 자동 발행</h1>
    <p>영상 선택 → AI 캡션·해시태그 → Mirra 업로드 → 지금 발행</p>
    <nav class="tabs"><a href="/" class="active">영상 1개</a><a href="/batch.html">여러 개 한번에</a></nav>
    <div id="keyStatus" class="key-status"></div>
  </header>

  <main class="layout">
    <aside>
      <ol id="steps" class="steps"></ol>
    </aside>

    <section class="panels">
      <!-- 1~3단계 -->
      <article class="panel" id="panel-video">
        <h2><span class="num">1</span>영상 선택</h2>
        <label class="drop" id="drop">
          <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.m4v,.webm" hidden />
          <span id="dropText">PC 에 저장된 영상을 끌어다 놓거나 클릭해서 선택하세요<br /><small>mp4 · mov · webm</small></span>
        </label>
        <video id="preview" controls hidden></video>
        <details class="options">
          <summary>캡션 작성 옵션</summary>
          <div class="grid">
            <label>톤<input id="optTone" value="친근하고 자연스러운" /></label>
            <label>언어<input id="optLanguage" value="한국어" /></label>
            <label>해시태그 개수<input id="optCount" type="number" min="3" max="30" value="15" /></label>
            <label class="wide">추가 요청 · 브랜드 정보<textarea id="optNotes" rows="2" placeholder="예) 성수동 카페 '땡큐', 신메뉴 홍보, 매장 방문 유도"></textarea></label>
          </div>
        </details>
        <button id="btnAnalyze" class="primary" disabled>영상 업로드 및 캡션·해시태그 작성</button>
      </article>

      <article class="panel" id="panel-caption" hidden>
        <h2><span class="num">2·3</span>캡션 · 해시태그</h2>
        <p class="summary" id="summary"></p>
        <label>캡션<textarea id="caption" rows="9"></textarea></label>
        <label>해시태그 <small>(띄어쓰기로 구분)</small><textarea id="hashtags" rows="3"></textarea></label>
        <label>YouTube 제목 <small>(YouTube 계정 발행 시 사용)</small><input id="youtubeTitle" maxlength="100" /></label>

        <div class="thumbs-section">
          <h3>썸네일 추천 <small>(Instagram 릴스 커버 · YouTube 썸네일로 사용)</small></h3>
          <div id="thumbs" class="thumbs"></div>
          <div class="thumb-tools">
            <button id="btnCaptureFrame" type="button">＋ 미리보기의 현재 장면 추가</button>
            <label class="inline"><input type="checkbox" id="thumbTextOn" /> 썸네일에 문구 넣기</label>
            <input id="thumbText" maxlength="30" placeholder="썸네일 문구" disabled />
          </div>
          <p class="muted small" id="thumbHint">마음에 드는 장면을 눌러 선택하세요. 선택하지 않으면 플랫폼이 자동으로 정합니다.</p>
        </div>
        <button id="btnMirra" class="primary">Mirra 접속 및 영상 업로드</button>
      </article>

      <!-- 7~8단계 -->
      <article class="panel" id="panel-post" hidden>
        <h2><span class="num">7</span>캡션 및 해시태그 입력</h2>
        <label>Mirra 게시물 본문<textarea id="postText" rows="12"></textarea></label>
        <p class="counter" id="counter"></p>

        <h2><span class="num">8</span>발행할 계정 선택</h2>
        <div id="accounts" class="accounts"></div>
        <button id="btnDrafts" class="primary">최종 내용 확인으로</button>
      </article>

      <!-- 9~10단계 -->
      <article class="panel" id="panel-review" hidden>
        <h2><span class="num">9</span>최종 내용 확인</h2>
        <div id="review"></div>
        <label class="confirm"><input type="checkbox" id="confirmCheck" /> 영상, 캡션, 해시태그, 발행 계정을 모두 확인했습니다.</label>
        <button id="btnPublish" class="publish" disabled>지금 발행</button>
      </article>

      <article class="panel" id="panel-result" hidden>
        <h2><span class="num">10</span>발행 결과</h2>
        <div id="result"></div>
        <button id="btnRestart">새 영상 발행하기</button>
      </article>

      <p id="error" class="error" hidden></p>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
